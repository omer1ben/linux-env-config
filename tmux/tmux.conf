# ---- Prefix: Ctrl+a instead of Ctrl+b ----
unbind C-b
set -g prefix C-a
# Press Ctrl+a twice to send a literal Ctrl+a to the program inside
# (e.g. beginning-of-line in bash).
bind C-a send-prefix

# ---- Terminal & keys ----
# Advertise the right terminal type to programs inside tmux.
set -g default-terminal "tmux-256color"
# True color support for the outer terminals.
set -as terminal-features 'xterm-ghostty:RGB,xterm-256color:RGB'

# Forward modified keys (Alt+Enter, Shift+Enter, Ctrl+Enter, ...) to
# programs that ask for them, e.g. Claude Code.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Don't pause after Esc waiting for an escape sequence (snappy Esc in vim;
# Alt keys still work since they arrive as a complete sequence).
set -s escape-time 10

# Scrollback lines per pane (default is 2000). Applies to new panes.
set -g history-limit 50000

# ---- Vim-style pane navigation: prefix + h/j/k/l ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Resize with prefix + H/J/K/L (hold to repeat)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload this file with prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
